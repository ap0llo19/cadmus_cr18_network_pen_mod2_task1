---

# CADMUS Module 2: Discovery, Scanning & Enumeration
# Internal scanning assessment
#
# Scope:
#   - No exploitation
#   - No brute forcing
#   - No privilege escalation
#   - Discovery, scanning, service enumeration, banner grabbing, NSE scripts,
#     SMB/SNMP/RDP/SSH/FTP/SMTP enumeration, and reporting only.
#
# Lab hosts:
#   vma  192.168.56.10   trainee workstation
#   WEB01      192.168.56.58   HTTP/HTTPS web server
#   DEV01      192.168.56.75   SSH/FTP/Git/development portal
#   MAIL01     192.168.56.127  SMTP mail server
#   DB01       192.168.56.152  PostgreSQL database server
#   MON01      192.168.56.186  SNMP/monitoring services
#   FILE01     192.168.56.201  Windows MSRPC/SMB/RDP/WinRM file server
#   WS01       192.168.56.247  Windows MSRPC/SMB/WinRM workstation

# ----------------------------------------------------------------------------
#  man - the sandbox management node. It is not in topology.yml; the platform
#  adds it to the generated inventory. Every trainee SSH and GUI session is
#  brokered through it, so an unattended upgrade firing mid-lab can stall or
#  drop those sessions.
# ----------------------------------------------------------------------------
- name: Disable apt auto-update on the management node
  hosts: man
  become: true

  tasks:
    - name: Disable unattended upgrades in apt periodic config
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false


# ----------------------------------------------------------------------------
# Common baseline
# ----------------------------------------------------------------------------
- name: Common baseline for all lab machines
  hosts: vma:web01:dev01:mail01:db01:mon01
  become: true
  gather_facts: true

  vars:
    lab_domain: cadmus.local
    lab_hosts:
      - { ip: "192.168.56.10", name: "vma", alias: "VMA" }
      - { ip: "192.168.56.58", name: "web01", alias: "WEB01 web01.cadmus.local" }
      - { ip: "192.168.56.75", name: "dev01", alias: "DEV01 dev01.cadmus.local" }
      - { ip: "192.168.56.127", name: "mail01", alias: "MAIL01 mail01.cadmus.local" }
      - { ip: "192.168.56.152", name: "db01", alias: "DB01 db01.cadmus.local" }
      - { ip: "192.168.56.186", name: "mon01", alias: "MON01 mon01.cadmus.local" }
      - { ip: "192.168.56.201", name: "file01", alias: "FILE01 file01.cadmus.local" }
      - { ip: "192.168.56.247", name: "ws01", alias: "WS01 ws01.cadmus.local" }

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted

  tasks:
    - name: Disable and mask unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Wait for any apt/dpkg lock to release
      ansible.builtin.shell: >
        timeout 300 sh -c 'while fuser /var/lib/dpkg/lock-frontend
        /var/lib/apt/lists/lock /var/cache/apt/archives/lock
        /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done'
      changed_when: false
      failed_when: false

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - python3
          - curl
        state: present
        update_cache: true

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    # Targets only. Seeding this on vma would hand the trainee the
    # asset inventory the lab asks them to build by scanning.
    - name: Add internal lab host mappings
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} CADMUS MODULE 2 INTERNAL HOSTS"
        block: |
          {% for item in lab_hosts %}
          {{ item.ip }} {{ item.name }} {{ item.alias }}
          {% endfor %}
      when: inventory_hostname != 'vma'

    - name: Configure SSH login banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        mode: '0644'
        content: |
          CADMUS Module 2 Internal Assessment
          Host: {{ inventory_hostname | upper }}
          Authorized enumeration training environment only.

    - name: Enable SSH banner
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Banner'
        line: 'Banner /etc/issue.net'
      notify: Restart SSH

    # nmap opens a connection per NSE script - ssh-hostkey and ssh2-enum-algos
    # each get their own, on top of the -sV probe. The stock 10:30:100 starts
    # dropping unauthenticated connections past ten, and a dropped one is closed
    # before the identification string, which surfaces as
    # "kex_exchange_identification: read: Connection reset by peer" and a failed
    # ssh-hostkey script. On a one-vCPU host each handshake is slow enough that
    # they pile up, and several trainees scanning at once makes it worse.
    - name: Raise the unauthenticated connection limit for scanning
      ansible.builtin.copy:
        content: |
          MaxStartups 100:30:200
          MaxSessions 50
        dest: /etc/ssh/sshd_config.d/10-lab.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Ensure SSH is running
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true


# ----------------------------------------------------------------------------
# VMA - trainee workstation
# ----------------------------------------------------------------------------
- name: Provision vma (attacker)
  hosts: vma
  become: true
  gather_facts: true

  roles:
    - role: user-access
      user_access_username: user
      user_access_password: 'Password123'
      user_access_sudo: true

  tasks:
    # Kali images boot with a stack-prefixed hostname that /etc/hosts does not
    # resolve, which makes every sudo call emit "unable to resolve host".
    # The base image ships '127.0.1.1 kali.kali kali'. The platform renames the
    # host, so that alias is stale, and the task below manages only its own line -
    # which leaves two 127.0.1.1 entries and tells anyone who reads /etc/hosts that
    # this is a stock Kali image rather than a company workstation.
    - name: Drop the base image's leftover 127.0.1.1 alias
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+kali'
        state: absent

    - name: Ensure /etc/hosts resolves the renamed hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\b'
        line: "127.0.1.1 {{ ansible_hostname }}"
        state: present

    - name: Install scanning and enumeration tools
      ansible.builtin.apt:
        name:
          - arp-scan
          - nmap
          - smbclient
          - snmp
          - ftp
          - netcat-openbsd
          - curl
          - openssl
          - postgresql-client
        state: present
        update_cache: true

    - name: Create trainee working directories
      ansible.builtin.file:
        path: "/home/user/{{ item }}"
        state: directory
        owner: user
        group: user
        mode: '0755'
      loop:
        - Desktop
        - Desktop/module2-internal


# ----------------------------------------------------------------------------
# WEB01 - HTTP/HTTPS target
# ----------------------------------------------------------------------------
- name: Provision WEB01
  hosts: web01
  become: true
  gather_facts: true

  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted

  tasks:
    - name: Install Apache and OpenSSL
      ansible.builtin.apt:
        name:
          - apache2
          - openssl
        state: present
        update_cache: true

    - name: Enable Apache modules
      ansible.builtin.command: "a2enmod {{ item }}"
      loop:
        - ssl
        - headers
      register: apache_modules
      changed_when: "'already enabled' not in apache_modules.stdout"
      notify: Restart Apache

    - name: Configure Apache service tokens for banner grabbing
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/cadmus-banner.conf
        mode: '0644'
        content: |
          ServerName web01.cadmus.local
          ServerTokens Full
          ServerSignature On
          Header always set X-CADMUS-Asset "WEB01"
          <If "%{SERVER_PORT} == '80'">
              Header always set Secret-Value "internal-only-do-not-expose"
          </If>
      notify: Restart Apache

    - name: Enable Apache banner configuration
      ansible.builtin.command: a2enconf cadmus-banner
      register: apache_conf
      changed_when: "'already enabled' not in apache_conf.stdout"
      notify: Restart Apache

    - name: Create WEB01 web directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop:
        - /var/www/html/status
        - /var/www/html/assets

    - name: Deploy WEB01 index page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!doctype html>
          <html>
          <head><title>WEB01 - Customer Portal</title></head>
          <body>
            <h1>WEB01 Customer Portal</h1>
            <p>Internal training web service for CADMUS Module 2.</p>
            <p>Environment: internal assessment range</p>
          </body>
          </html>

    - name: Deploy WEB01 status page
      ansible.builtin.copy:
        dest: /var/www/html/status/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!doctype html>
          <html>
          <head><title>WEB01 - Service Status</title></head>
          <body>
            <h1>WEB01 Service Status</h1>
            <ul>
              <li>HTTP: online</li>
              <li>HTTPS: online</li>
              <li>Owner: Web Operations</li>
            </ul>
          </body>
          </html>

    - name: Deploy robots.txt
      ansible.builtin.copy:
        dest: /var/www/html/robots.txt
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          User-agent: *
          Disallow: /status/
          Disallow: /assets/
          Disallow: /admin/api/parseinfo

    - name: Create self-signed certificate for WEB01
      ansible.builtin.command: >
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650
        -subj /CN=web01.cadmus.local/O=CADMUS-Training/OU=Module-2
        -keyout /etc/ssl/private/web01.key
        -out /etc/ssl/certs/web01.crt
      args:
        creates: /etc/ssl/certs/web01.crt
      notify: Restart Apache

    - name: Configure HTTPS virtual host
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/default-ssl.conf
        mode: '0644'
        content: |
          <IfModule mod_ssl.c>
            <VirtualHost _default_:443>
              ServerAdmin webops@cadmus.local
              ServerName web01.cadmus.local
              DocumentRoot /var/www/html
              ErrorLog ${APACHE_LOG_DIR}/web01_ssl_error.log
              CustomLog ${APACHE_LOG_DIR}/web01_ssl_access.log combined
              SSLEngine on
              SSLCertificateFile /etc/ssl/certs/web01.crt
              SSLCertificateKeyFile /etc/ssl/private/web01.key
            </VirtualHost>
          </IfModule>
      notify: Restart Apache

    - name: Enable HTTPS site
      ansible.builtin.command: a2ensite default-ssl
      register: apache_ssl_site
      changed_when: "'already enabled' not in apache_ssl_site.stdout"
      notify: Restart Apache

    - name: Ensure Apache is running
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: true


# ----------------------------------------------------------------------------
# DEV01 - SSH, FTP, Git, and dev portal target
# ----------------------------------------------------------------------------
- name: Provision DEV01
  hosts: dev01
  become: true
  gather_facts: true

  handlers:
    - name: Restart vsftpd
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted

    - name: Restart git-daemon
      ansible.builtin.systemd:
        name: git-daemon-cadmus
        state: restarted
        daemon_reload: true

    - name: Restart dev portal
      ansible.builtin.systemd:
        name: dev-portal
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install DEV01 packages
      ansible.builtin.apt:
        name:
          - vsftpd
          - git
        state: present
        update_cache: true

    - name: Create FTP root
      ansible.builtin.file:
        path: /srv/ftp
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Add FTP readme
      ansible.builtin.copy:
        dest: /srv/ftp/README.txt
        mode: '0644'
        content: |
          DEV01 anonymous FTP archive.
          {{ ftp_flag }}

    - name: Configure vsftpd for anonymous read-only access
      ansible.builtin.copy:
        dest: /etc/vsftpd.conf
        mode: '0644'
        content: |
          listen=YES
          listen_ipv6=NO
          anonymous_enable=YES
          no_anon_password=YES
          anon_root=/srv/ftp
          local_enable=NO
          write_enable=NO
          anon_upload_enable=NO
          anon_mkdir_write_enable=NO
          dirmessage_enable=YES
          use_localtime=YES
          xferlog_enable=YES
          connect_from_port_20=YES
          secure_chroot_dir=/var/run/vsftpd/empty
          pam_service_name=vsftpd
          rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
          rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          ssl_enable=NO
          ftpd_banner=DEV01 FTP service - CADMUS development archive
      notify: Restart vsftpd

    - name: Create Git repository directory
      ansible.builtin.file:
        path: /srv/git/web-inventory.git
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Initialize bare Git repository
      ansible.builtin.command: git init --bare /srv/git/web-inventory.git
      args:
        creates: /srv/git/web-inventory.git/HEAD

    - name: Mark Git repository as exportable
      ansible.builtin.file:
        path: /srv/git/web-inventory.git/git-daemon-export-ok
        state: touch
        mode: '0644'

    - name: Set Git repository description
      ansible.builtin.copy:
        dest: /srv/git/web-inventory.git/description
        mode: '0644'
        content: WEB01 inventory repository for internal enumeration training
    
    - name: Seed Git repository with initial commit
      ansible.builtin.shell: |
        set -e

        if ! git --git-dir=/srv/git/web-inventory.git rev-parse --verify refs/heads/main >/dev/null 2>&1; then
          rm -rf /tmp/web-inventory-seed
          mkdir -p /tmp/web-inventory-seed

          git init /tmp/web-inventory-seed
          git -C /tmp/web-inventory-seed config user.name "CADMUS Development"
          git -C /tmp/web-inventory-seed config user.email "development@cadmus.local"

          cat > /tmp/web-inventory-seed/README.md <<'EOF'
        # Web Inventory

        Internal WEB01 inventory repository.

        This repository is used by the CADMUS development environment.
        EOF

          git -C /tmp/web-inventory-seed add README.md
          git -C /tmp/web-inventory-seed commit -m "Initial inventory commit"
          git -C /tmp/web-inventory-seed branch -M main
          git -C /tmp/web-inventory-seed remote add origin /srv/git/web-inventory.git
          git -C /tmp/web-inventory-seed push origin main

          git --git-dir=/srv/git/web-inventory.git symbolic-ref HEAD refs/heads/main

          rm -rf /tmp/web-inventory-seed
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Set Git repository ownership for git daemon
      ansible.builtin.file:
        path: /srv/git/web-inventory.git
        owner: nobody
        group: nogroup
        mode: '0755'
        recurse: true

    - name: Create git-daemon systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/git-daemon-cadmus.service
        mode: '0644'
        content: |
          [Unit]
          Description=CADMUS Git Daemon
          After=network.target

          [Service]
          ExecStart=/usr/bin/git daemon --listen=0.0.0.0 --port=9418 --reuseaddr --base-path=/srv/git --export-all --informative-errors --verbose
          Restart=always
          User=nobody
          Group=nogroup

          [Install]
          WantedBy=multi-user.target
      notify: Restart git-daemon

    - name: Create development portal directory
      ansible.builtin.file:
        path: /srv/dev-portal
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy development portal page
      ansible.builtin.copy:
        dest: /srv/dev-portal/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!doctype html>
          <html>
          <head><title>DEV01 - Development Portal</title></head>
          <body>
            <h1>DEV01 Development Portal</h1>
            <p>Internal build and test service.</p>
            <p>Expected services: SSH, FTP, Git, HTTP development portal.</p>
            <p>Development repository: web-inventory.git</p>
          </body>
          </html>

    - name: Create dev portal systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/dev-portal.service
        mode: '0644'
        content: |
          [Unit]
          Description=DEV01 Simple Development Portal
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /srv/dev-portal
          Restart=always
          User=www-data
          Group=www-data

          [Install]
          WantedBy=multi-user.target
      notify: Restart dev portal

    - name: Ensure DEV01 services are running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - vsftpd
        - git-daemon-cadmus
        - dev-portal


# ----------------------------------------------------------------------------
# MAIL01 - SMTP target
# ----------------------------------------------------------------------------
- name: Provision MAIL01
  hosts: mail01
  become: true
  gather_facts: true

  handlers:
    - name: Restart Postfix
      ansible.builtin.systemd:
        name: postfix
        state: restarted

  tasks:
    - name: Preseed Postfix mail type
      ansible.builtin.debconf:
        name: postfix
        question: postfix/main_mailer_type
        value: 'Internet Site'
        vtype: select

    - name: Preseed Postfix mail name
      ansible.builtin.debconf:
        name: postfix
        question: postfix/mailname
        value: mail01.cadmus.local
        vtype: string

    - name: Install SMTP service
      ansible.builtin.apt:
        name:
          - postfix
        state: present
        update_cache: true

    - name: Configure Postfix main settings
      ansible.builtin.command: "postconf -e '{{ item }}'"
      loop:
        - 'myhostname = mail01.cadmus.local'
        - 'mydomain = cadmus.local'
        - 'myorigin = /etc/mailname'
        - 'inet_interfaces = all'
        - 'inet_protocols = ipv4'
        - 'smtpd_banner = $myhostname ESMTP Postfix - CADMUS internal mail gateway'
        - 'disable_vrfy_command = no'
      changed_when: true
      notify: Restart Postfix

    - name: Ensure Postfix is running
      ansible.builtin.systemd:
        name: postfix
        state: started
        enabled: true


# ----------------------------------------------------------------------------
# DB01 - PostgreSQL database target
# ----------------------------------------------------------------------------
- name: Provision DB01
  hosts: db01
  become: true
  gather_facts: true

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
        state: present
        update_cache: true

    - name: Locate PostgreSQL configuration directory
      ansible.builtin.shell: "ls -d /etc/postgresql/*/main | head -n 1"
      register: pg_conf_dir
      changed_when: false

    - name: Configure PostgreSQL to listen on the internal network
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir.stdout }}/postgresql.conf"
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Add PostgreSQL training network rule
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir.stdout }}/pg_hba.conf"
        line: 'host    all             all             192.168.56.0/24          scram-sha-256'
        insertafter: EOF
      notify: Restart PostgreSQL

    - name: Ensure PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Add DB01 service note
      ansible.builtin.copy:
        dest: /opt/db01-services.txt
        mode: '0644'
        content: |
          DB01 internal database server.
          Expected exposed service for enumeration:
          - PostgreSQL on TCP/5432
          This host is for service identification and reporting only.


# ----------------------------------------------------------------------------
# MON01 - SNMP and monitoring services target
# ----------------------------------------------------------------------------
- name: Provision MON01
  hosts: mon01
  become: true
  gather_facts: true

  handlers:
    - name: Restart SNMPD
      ansible.builtin.systemd:
        name: snmpd
        state: restarted

    - name: Restart monitoring dashboard
      ansible.builtin.systemd:
        name: monitoring-dashboard
        state: restarted
        daemon_reload: true

    - name: Restart metrics service
      ansible.builtin.systemd:
        name: node-metrics-training
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install SNMP service
      ansible.builtin.apt:
        name:
          - snmpd
        state: present
        update_cache: true

    - name: Configure SNMP read-only community for enumeration
      ansible.builtin.copy:
        dest: /etc/snmp/snmpd.conf
        mode: '0644'
        content: |
          agentAddress udp:161
          rocommunity public 192.168.56.0/24
          sysLocation CADMUS Internal Monitoring Segment - MON01
          sysContact noc@cadmus.local
          sysServices 72
      notify: Restart SNMPD

    - name: Create monitoring app directory
      ansible.builtin.file:
        path: /opt/mon01
        state: directory
        mode: '0755'

    - name: Deploy monitoring dashboard app
      ansible.builtin.copy:
        dest: /opt/mon01/dashboard.py
        mode: '0644'
        content: |
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html")
                  self.send_header("X-CADMUS-Asset", "MON01")
                  self.end_headers()
                  self.wfile.write(b"""<!doctype html>
          <html><head><title>MON01 - Monitoring Dashboard</title></head>
          <body><h1>MON01 Monitoring Dashboard</h1>
          <p>Internal monitoring interface for enumeration practice.</p>
          <p>SNMP community configured for read-only monitoring.</p>
          </body></html>""")

          HTTPServer(("0.0.0.0", 3000), Handler).serve_forever()

    - name: Deploy metrics endpoint app
      ansible.builtin.copy:
        dest: /opt/mon01/metrics.py
        mode: '0644'
        content: |
          from http.server import BaseHTTPRequestHandler, HTTPServer

          METRICS = b"""cadmus_training_service_info{host=\"MON01\",service=\"node-metrics-training\",info=\"{{ metrics_flag }}\"} 1
          node_cpu_seconds_total{cpu=\"0\",mode=\"idle\"} 12345
          node_memory_MemAvailable_bytes 536870912
          """

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; version=0.0.4")
                  self.send_header("X-CADMUS-Asset", "MON01")
                  self.end_headers()
                  self.wfile.write(METRICS)

          HTTPServer(("0.0.0.0", 9100), Handler).serve_forever()

    - name: Create monitoring dashboard service
      ansible.builtin.copy:
        dest: /etc/systemd/system/monitoring-dashboard.service
        mode: '0644'
        content: |
          [Unit]
          Description=MON01 Monitoring Dashboard
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/mon01/dashboard.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
      notify: Restart monitoring dashboard

    - name: Create metrics service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node-metrics-training.service
        mode: '0644'
        content: |
          [Unit]
          Description=MON01 Training Metrics Endpoint
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/mon01/metrics.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
      notify: Restart metrics service

    - name: Ensure MON01 services are running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - snmpd
        - monitoring-dashboard
        - node-metrics-training


# ----------------------------------------------------------------------------
# Windows baseline - FILE01 and WS01
# ----------------------------------------------------------------------------
- name: Common Windows baseline for enumeration targets
  hosts: file01:ws01
  gather_facts: true

  vars:
    lab_hosts:
      - { ip: "192.168.56.10", name: "vma", alias: "VMA" }
      - { ip: "192.168.56.58", name: "web01", alias: "WEB01 web01.cadmus.local" }
      - { ip: "192.168.56.75", name: "dev01", alias: "DEV01 dev01.cadmus.local" }
      - { ip: "192.168.56.127", name: "mail01", alias: "MAIL01 mail01.cadmus.local" }
      - { ip: "192.168.56.152", name: "db01", alias: "DB01 db01.cadmus.local" }
      - { ip: "192.168.56.186", name: "mon01", alias: "MON01 mon01.cadmus.local" }
      - { ip: "192.168.56.201", name: "file01", alias: "FILE01 file01.cadmus.local" }
      - { ip: "192.168.56.247", name: "ws01", alias: "WS01 ws01.cadmus.local" }

  tasks:
    - name: Set Windows computer name
      ansible.windows.win_hostname:
        name: "{{ inventory_hostname | upper }}"
      register: windows_hostname

    - name: Reboot Windows host if hostname changed
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: windows_hostname.reboot_required

    - name: Add internal lab host mappings to Windows hosts file
      ansible.windows.win_shell: |
        $hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
        $entry = "{{ item.ip }} {{ item.name }} {{ item.alias }}"

        if (-not (Select-String -Path $hostsPath -Pattern ([regex]::Escape($entry)) -Quiet)) {
          Add-Content -Path $hostsPath -Value $entry
        }
      loop: "{{ lab_hosts }}"

    - name: Enable ICMP echo replies for host discovery
      ansible.windows.win_shell: |
        Enable-NetFirewallRule -Name FPS-ICMP4-ERQ-In -ErrorAction SilentlyContinue
      changed_when: false

    - name: Configure Windows enumeration firewall rules
      ansible.windows.win_shell: |
        $rules = @(
          @{ Name = "CADMUS-RPC-135";   Port = 135 },
          @{ Name = "CADMUS-SMB-445";   Port = 445 },
          @{ Name = "CADMUS-WINRM-5985"; Port = 5985 }
        )

        foreach ($rule in $rules) {
          if (-not (Get-NetFirewallRule -DisplayName $rule.Name -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule `
              -DisplayName $rule.Name `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort $rule.Port `
              -RemoteAddress 192.168.56.0/24 `
              -Action Allow | Out-Null
          }
        }
      changed_when: false

    - name: Ensure WinRM is running
      ansible.windows.win_shell: |
        Set-Service -Name WinRM -StartupType Automatic
        Start-Service -Name WinRM
      changed_when: false

    - name: Configure SMB service for enumeration
      ansible.windows.win_shell: |
        Set-Service -Name LanmanServer -StartupType Automatic
        Start-Service -Name LanmanServer
        Set-SmbServerConfiguration -EnableSMB1Protocol $false -EnableSMB2Protocol $true -AnnounceServer $true -ServerHidden $false -Force
      changed_when: false

    - name: Create low-privileged SMB enumeration user
      ansible.windows.win_user:
        name: cadmus_enum
        password: "BlueTeam!2026"
        description: CADMUS Module 2 credentialed enumeration account
        password_never_expires: true
        user_cannot_change_password: true
        state: present
        groups:
          - Users

    - name: Create restricted file-share user
      ansible.windows.win_user:
        name: finance_auditor
        password: "ShareView!2026"
        description: Restricted share account for FILE01 enumeration context
        password_never_expires: true
        user_cannot_change_password: true
        state: present
        groups:
          - Users


# ----------------------------------------------------------------------------
# FILE01 - Windows file server enumeration target
# ----------------------------------------------------------------------------
- name: Provision FILE01 Windows services
  hosts: file01
  gather_facts: true

  tasks:
    - name: Enable Remote Desktop on FILE01
      ansible.windows.win_shell: |
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" `
          -Value 0

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

        Set-Service -Name TermService -StartupType Automatic
        Start-Service -Name TermService
      changed_when: false

    - name: Create FILE01 SMB share structure
      ansible.windows.win_shell: |
        $shares = @("C:\Shares", "C:\Shares\Public", "C:\Shares\IT", "C:\Shares\Finance")
        foreach ($sharePath in $shares) {
          if (!(Test-Path $sharePath)) {
            New-Item -ItemType Directory -Path $sharePath | Out-Null
          }
        }

        Set-Content -Path "C:\Shares\Public\README.txt" -Value @"
        FILE01 public share.
        This share is intentionally readable for SMB enumeration practice.
        "@

        Set-Content -Path "C:\Shares\IT\asset-register.txt" -Value @"
        Asset register summary:
        WEB01  - web services
        DEV01  - development services
        MAIL01 - mail gateway
        DB01   - database services
        MON01  - monitoring services
        FILE01 - Windows file services
        WS01   - Windows workstation services
        "@

        Set-Content -Path "C:\Shares\Finance\finance-share-notice.txt" -Value @"
        Restricted finance share.
        Trainees should identify the share and access restrictions, not bypass them.
        "@
      changed_when: false

    - name: Configure FILE01 NTFS permissions
      ansible.windows.win_shell: |
        icacls "C:\Shares\Public" /inheritance:e /grant "Everyone:(OI)(CI)RX" /grant "cadmus_enum:(OI)(CI)RX" /T | Out-Null
        icacls "C:\Shares\IT" /inheritance:e /grant "cadmus_enum:(OI)(CI)RX" /T | Out-Null
        icacls "C:\Shares\Finance" /inheritance:r /grant "Administrators:(OI)(CI)F" /grant "finance_auditor:(OI)(CI)RX" /T | Out-Null
      changed_when: false

    - name: Create FILE01 SMB shares
      ansible.windows.win_shell: |
        $definitions = @(
          @{ Name = "Public";  Path = "C:\Shares\Public";  Description = "FILE01 public read-only share";       Read = "Everyone" },
          @{ Name = "IT";      Path = "C:\Shares\IT";      Description = "FILE01 IT asset register share";    Read = "cadmus_enum" },
          @{ Name = "Finance"; Path = "C:\Shares\Finance"; Description = "FILE01 restricted finance share";    Read = "finance_auditor" }
        )

        foreach ($share in $definitions) {
          $existing = Get-SmbShare -Name $share.Name -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-SmbShare -Name $share.Name -Path $share.Path -ReadAccess $share.Read -Description $share.Description | Out-Null
          } else {
            Set-SmbShare -Name $share.Name -Description $share.Description -Force | Out-Null
          }
        }
      changed_when: false

    - name: Add FILE01 enumeration note
      ansible.windows.win_copy:
        dest: C:\CADMUS_FILE01_SCOPE.txt
        content: |
          CADMUS Module 2 - FILE01
          Windows Server 2019 enumeration target.
          Expected enumeration areas:
          - TCP/135 MS RPC Endpoint Mapper
          - TCP/445 SMB service discovery and enumeration
          - SMB protocol and OS discovery NSE scripts
          - Share listing with the provided cadmus_enum account
          - TCP/3389 RDP service identification and RDP NSE scripts
          - TCP/5985 WinRM service identification


# ----------------------------------------------------------------------------
# WS01 - Windows workstation enumeration target
# ----------------------------------------------------------------------------
- name: Provision WS01 Windows services
  hosts: ws01
  gather_facts: true

  tasks:
    - name: Ensure Remote Desktop is disabled on WS01
      ansible.windows.win_shell: |
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" `
          -Value 1

        Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

        Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
        Set-Service -Name TermService -StartupType Disabled
      changed_when: false

    - name: Create WS01 SMB share structure
      ansible.windows.win_shell: |
        $shares = @(
          "C:\Shares",
          "C:\Shares\Shared"
        )

        foreach ($sharePath in $shares) {
          if (!(Test-Path $sharePath)) {
            New-Item -ItemType Directory -Path $sharePath | Out-Null
          }
        }

        Set-Content -Path "C:\Shares\Shared\workstation-info.txt" -Value @"
        WS01 workstation share.
        "@
      changed_when: false

    - name: Configure WS01 NTFS permissions
      ansible.windows.win_shell: |
        icacls "C:\Shares\Shared" /inheritance:e `
          /grant "Everyone:(OI)(CI)RX" `
          /grant "*S-1-5-7:(OI)(CI)RX" `
          /grant "cadmus_enum:(OI)(CI)RX" /T | Out-Null
      changed_when: false

    - name: Create WS01 SMB shares
      ansible.windows.win_shell: |
        $definitions = @(
          @{
            Name = "Shared"
            Path = "C:\Shares\Shared"
            Description = "WS01 anonymous shared workstation folder"
            Read = "Everyone"
          }
        )

        foreach ($share in $definitions) {
          $existing = Get-SmbShare -Name $share.Name -ErrorAction SilentlyContinue

          if (-not $existing) {
            New-SmbShare `
              -Name $share.Name `
              -Path $share.Path `
              -ReadAccess $share.Read `
              -Description $share.Description | Out-Null
          }
          else {
            Set-SmbShare `
              -Name $share.Name `
              -Description $share.Description `
              -Force | Out-Null
          }
        }
      changed_when: false

    - name: Grant anonymous SMB access to WS01 Shared
      ansible.windows.win_shell: |
        Grant-SmbShareAccess `
          -Name "Shared" `
          -AccountName "ANONYMOUS LOGON" `
          -AccessRight Read `
          -Force | Out-Null
      changed_when: false

    - name: Allow anonymous users to receive Everyone permissions
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: EveryoneIncludesAnonymous
        data: 1
        type: dword

    - name: Permit anonymous enumeration
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RestrictAnonymous
        data: 0
        type: dword

    - name: Allow Shared as a null-session share
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: NullSessionShares
        data:
          - Shared
        type: multistring
    
    - name: Allow anonymous SMB share enumeration through srvsvc
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: NullSessionPipes
        data:
          - srvsvc
        type: multistring

    - name: Keep null-session access restricted to explicitly allowed shares
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: RestrictNullSessAccess
        data: 1
        type: dword

    # EveryoneIncludesAnonymous and RestrictAnonymous live under Lsa and are
    # read by LSASS at boot. Restarting LanmanServer reloads the NullSession*
    # values but not those, so the null session is refused at authentication
    # before share enumeration is ever reached. Only a reboot applies them.
    - name: Reboot WS01 so the LSA anonymous-access settings take effect
      ansible.windows.win_reboot:
        reboot_timeout: 900

    - name: Add WS01 enumeration note
      ansible.windows.win_copy:
        dest: C:\CADMUS_WS01_SCOPE.txt
        content: |
          CADMUS Module 2 - WS01
          Windows 10 workstation enumeration target.
          Expected enumeration areas:
          - TCP/135 MS RPC Endpoint Mapper
          - TCP/445 SMB service discovery and enumeration
          - Anonymous SMB share enumeration
          - Anonymous access to the Shared share
          - Comparison of anonymous and authenticated share access
          - TCP/5985 WinRM service identification
